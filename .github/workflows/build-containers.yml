name: Build, Merge, and Push

permissions:
  contents: write
  packages: write

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      skip_diff_check:
        description: 'Diff-Check ignorieren und alle Images bauen'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
env:
  REGISTRY_REPO: 'ghcr.io/${{ github.repository }}'
  TAG: 'latest'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: "ubuntu-24.04"
            platform: "linux/amd64"
          - os: "ubuntu-24.04-arm"
            platform: "linux/arm64"
    runs-on: "${{ matrix.os }}"
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      SKIP_DIFF_CHECK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_diff_check == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Build and push containers
        env:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
        run: |
          # prepare per-arch digest file
          rm -f /tmp/digests-${ARCH}.json || true
          touch /tmp/digests-${ARCH}.json

          echo -n $password | buildah login -u $username --password-stdin $registry 
          tasks=$(jq -c '.[]' images/tasks.json)
          for task in $tasks; do
            name=$(echo $task | jq -r '.name')
            dir=$(echo $task | jq -r '.dir')
            target=$(echo $task | jq -r '.target')
            forcecache=$(echo $task | jq -r '.cache')
            nolayers=$(echo $task | jq -r '.nolayers')
            image_name="$REGISTRY_REPO/$name"
            
            if [[ "$SKIP_DIFF_CHECK" != "true" ]] && git diff --quiet --exit-code HEAD^ HEAD $dir; then
              echo "Keine Änderungen in $dir, überspringe den Build-Prozess für $name"
              continue
            fi

            layers="--layers"
            if [[ $nolayers == "true" ]]; then
              layers=""
            fi

            cacheparams=""
            if [[ "$forcecache" == "true" ]]; then
              cacheparams="--cache-from $REGISTRY_REPO/cache --cache-to $REGISTRY_REPO/cache"
            fi

            buildah bud \
              --platform $PLATFORM \
              -f $dir/Dockerfile \
              --format docker \
              --tls-verify=true \
              -t $image_name:$ARCH-$TAG \
              --target $target \
              $layers $cacheparams \
              $dir
            
            # use --digestfile to capture digest directly from buildah push
            digest_file="/tmp/digest_${name}_${ARCH}.txt"
            buildah push --digestfile="$digest_file" $image_name:$ARCH-$TAG docker://$image_name:$ARCH-$TAG
            
            digest=""
            if [ -f "$digest_file" ]; then
              digest=$(cat "$digest_file")
              echo "Erfasster Digest für $image_name:$ARCH-$TAG: $digest"
            else
              echo "Warnung: Digest-Datei nicht gefunden für $image_name:$ARCH-$TAG"
            fi

            # store as newline-delimited JSON for easier merging later
            echo "{\"image\":\"$image_name\",\"tag\":\"$ARCH-$TAG\",\"digest\":\"$digest\"}" >> /tmp/digests-${ARCH}.json
          done
      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.json

  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      SKIP_DIFF_CHECK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_diff_check == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Log in to ghcr.io
        env:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
        run: |
          echo -n $password | docker login -u $username --password-stdin $registry 

      - name: Download amd64 digests
        uses: actions/download-artifact@v8
        with:
          name: digests-amd64
          path: /tmp/digests/amd64

      - name: Download arm64 digests
        uses: actions/download-artifact@v8
        with:
          name: digests-arm64
          path: /tmp/digests/arm64

      - name: Merge & push manifests
        env:
          TASKS: ${{ github.event_name == 'push' && env.DEFAULT_TASKS || github.event.inputs.tasks }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tasks=$(jq -c '.[]' images/tasks.json)
          for task in $tasks; do
            name=$(echo $task | jq -r '.name')
            dir=$(echo $task | jq -r '.dir')
            autoTag=$(echo $task | jq -r '.autoTag // empty')
            tag=$(echo $task | jq -r '.tag // empty')
            image_name="$REGISTRY_REPO/$name"

            if [ "$autoTag" = "true" ]; then
              tag=$(grep -oP '(?<=:).+?(?=@)' $dir/Dockerfile)
            fi
            final_manifest="$image_name:${tag:-$TAG}"

            if [[ "$SKIP_DIFF_CHECK" != "true" ]] && git diff --quiet --exit-code HEAD^..HEAD $dir; then
              echo "Keine Änderungen in $dir, überspringe den Build-Prozess für $name"
              continue
            fi

            # Collect source images with digests
            sources=()
            for arch in "amd64" "arm64"; do
              digestfile="/tmp/digests/$arch/digests-$arch.json"
              if [ -f "$digestfile" ]; then
                entry=$(jq -r --arg img "$image_name" 'select(.image==$img)' "$digestfile" 2>/dev/null || true)
                if [ -n "$entry" ] && [ "$entry" != "null" ]; then
                  digest=$(echo "$entry" | jq -r '.digest // empty')
                  arch_tag=$(echo "$entry" | jq -r '.tag // empty')
                  
                  if [ -n "$digest" ] && [ "$digest" != "null" ] && [ -n "$arch_tag" ]; then
                    echo "Adding source: $image_name:$arch_tag@$digest"
                    sources+=("$image_name:$arch_tag@$digest")
                  else
                    echo "Warning: No digest for $arch, using tag only"
                    sources+=("$image_name:$arch-$TAG")
                  fi
                else
                  echo "Warning: No entry found for $image_name in $arch digest file"
                  sources+=("$image_name:$arch-$TAG")
                fi
              else
                echo "Warning: Digest file not found for $arch"
                sources+=("$image_name:$arch-$TAG")
              fi
            done

            # Create multi-arch manifest using imagetools
            if [ ${#sources[@]} -gt 0 ]; then
              echo "Creating manifest: $final_manifest from ${sources[@]}"
              docker buildx imagetools create -t "$final_manifest" "${sources[@]}"
            else
              echo "Error: No source images found for $name"
              exit 1
            fi

            # Check if a matching Helm chart exists for this image
            chart_dir="charts/$name"
            if [ -d "$chart_dir" ] && [ -f "$chart_dir/values.yaml" ] && [ -f "$chart_dir/Chart.yaml" ]; then
              echo "Matching Helm chart found for $name at $chart_dir"
              manifest_digest=$(docker buildx imagetools inspect --raw "$final_manifest" | sha256sum | awk '{print $1}')
              echo "Multi-arch manifest digest: sha256:$manifest_digest"

              current_digest=$(grep -oP '(?<=sha256:)[0-9a-f]{64}' "$chart_dir/values.yaml" || true)
              if [ "$current_digest" = "$manifest_digest" ]; then
                echo "Chart $chart_dir already contains latest digest ($manifest_digest). Skipping chart update."
              else
                echo "Updating chart $chart_dir with new digest $manifest_digest..."
                sed -i -E "s|(tag:\s*\")[^\"]*(\")|\1latest@sha256:${manifest_digest}\2|" "$chart_dir/values.yaml"

                # Bump patch version in Chart.yaml
                current_version=$(awk -F': *' '$1 == "version" {print $2}' "$chart_dir/Chart.yaml" | tr -d ' "')
                IFS='.' read -r major minor patch <<< "$current_version"
                new_patch=$((patch + 1))
                new_version="${major}.${minor}.${new_patch}"
                echo "Bumping chart version: $current_version -> $new_version"
                sed -i -E "s|^(version:\s*).*|\1$new_version|" "$chart_dir/Chart.yaml"

                # Commit updated chart files to repository
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
                git add "$chart_dir/values.yaml" "$chart_dir/Chart.yaml"
                git commit -m "chore(chart): update $name image digest and bump version to $new_version"
                git push origin "HEAD:${GITHUB_REF_NAME:-main}"

                # Package and release Helm chart
                echo "Packaging and releasing Helm chart..."
                mkdir -p /tmp/chart-dist
                helm package "$chart_dir" -d /tmp/chart-dist
                package_file="/tmp/chart-dist/${name}-${new_version}.tgz"

                # Create GitHub Release with the tarball attached
                release_tag="${name}-${new_version}"
                echo "Creating GitHub Release $release_tag..."
                if gh release view "$release_tag" >/dev/null 2>&1; then
                  gh release upload "$release_tag" "$package_file" --clobber
                else
                  gh release create "$release_tag" "$package_file" \
                    --title "$name $new_version" \
                    --notes "Automated release for $name $new_version with image digest sha256:$manifest_digest"
                fi

                # Push OCI artifact to GHCR
                echo "Logging in to GHCR for Helm..."
                echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
                repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                echo "Pushing OCI chart to oci://ghcr.io/${repo_lower}/charts..."
                helm push "$package_file" "oci://ghcr.io/${repo_lower}/charts"
                echo "Successfully released chart $release_tag!"
              fi
            fi
          done