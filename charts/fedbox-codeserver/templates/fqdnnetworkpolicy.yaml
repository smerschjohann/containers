{{- if or (eq (toString .Values.fqdnNetworkPolicy.enabled) "true") (and (eq (toString .Values.fqdnNetworkPolicy.enabled) "<nil>") (eq (include "fedbox-codeserver.mode" .) "codejail")) }}
apiVersion: networking.gke.io/v1alpha3
kind: FQDNNetworkPolicy
metadata:
  name: {{ .Release.Name }}-googleapis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ include "fedbox-codeserver.labelsInstance" . }}
  policyTypes:
  - Egress
  egress:
  - to:
    - fqdns:
      - daily-cloudcode-pa.googleapis.com
    ports:
    - protocol: TCP
      port: 443
{{- end }}