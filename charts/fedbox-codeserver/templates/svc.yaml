apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ include "fedbox-codeserver.serviceSuffix" . }}
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: {{ include "fedbox-codeserver.labelsInstance" . }}
    app.kubernetes.io/name: {{ .Release.Name }}
  sessionAffinity: None
  type: ClusterIP